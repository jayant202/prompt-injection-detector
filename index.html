<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Injection Detector</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 100px; padding: 8px; font-size: 16px; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    .SAFE { background: #d4edda; }
    .LOW { background: #fff3cd; }
    .MEDIUM { background: #ffe0b2; }
    .HIGH { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>Prompt Injection Threat Detector</h1>
  <p>Type a message to check it for prompt injection phrases.</p>
  <textarea id="input" placeholder="Type or paste a message..."></textarea>
  <button id="btn">Check</button>
  <div id="result"></div>

  <script>
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (text === "") {
        return;
      }
      const response = await fetch("/check?text=" + encodeURIComponent(text));
      const data = await response.json();

      result.className = data.verdict;
      result.style.display = "block";
      result.textContent = "Verdict: " + data.verdict
        + " | Score: " + data.score
        + " | Matched: " + (data.matched.length ? data.matched.join(", ") : "none");
    });
  </script>
</body>
</html>
